
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Browser Theme -->
  <meta name="theme-color" content="#F8F5EF" />
  <meta name="color-scheme" content="light" />

  <!-- SEO -->
  <meta name="description"
    content="Discover, explore, and read books online with VedBook — your digital library for knowledge, learning, and inspiration." />

  <meta name="keywords"
    content="VedBook, digital library, online books, read books online, ebooks, learning, education" />

  <meta name="author" content="VedBook" />

  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VedBook" />
  <meta property="og:title" content="VedBook | Digital Library Platform" />
  <meta property="og:description" content="A world of knowledge, one book at a time. Explore and read with VedBook." />
  <meta property="og:image" content="/mainLogo.png" />

  <!-- Favicon / Website Logo -->
  <link rel="icon" type="image/png" href="/mainLogo.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/mainLogo.png" />
  <link rel="apple-touch-icon" href="/mainLogo.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Website Title -->
  <title>VedBook | Digital Library Platform</title>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="./src/main.jsx"></script>
</body>

</html>
